<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
</head>
<body>

  <div class="card">
    <h2>Register</h2>
    <div id="message"></div>
    <form id="registerForm">

      <div class="input-group">
        <input type="text" name="username" placeholder="Username">
        <span class="icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        </span>
      </div>

      <div class="input-group">
        <input type="email" name="email" placeholder="Email Address">
        <span class="icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        </span>
      </div>

      <div class="input-group">
        <input type="tel" name="phone" placeholder="Phone Number">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2C9.7 21 3 14.3 3 6a2 2 0 0 1 2-2z"/></svg>
        </span>
      </div>

      <div class="input-group">
        <input type="password" id="password" name="password" placeholder="Password">
        <span class="icon">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
      </div>

      <div class="input-group">
        <input type="password" name="confirmPassword" placeholder="Confirm Password">
        <span class="icon">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
      </div>

      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script>
    $(document).ready(function () {
      $.validator.addMethod("phPhone", function (value, element) {
        if (this.optional(element)) { return true; }
        if (!/^(09|\+639)\d{9}$/.test(value)) { return false; }
        var digits = value.slice(-9);
        return !/^(\d)\1+$/.test(digits); // rejects fake numbers like 09111111111
      }, "Enter a valid PH mobile number (e.g. 09171234567)");

      // email must have a proper domain, like name@gmail.com
      $.validator.addMethod("realEmail", function (value, element) {
        return this.optional(element) || /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(value);
      }, "Enter a valid email (e.g. name@gmail.com)");

      $("#registerForm").validate({
        rules: {
          username: {
            required: true,
            minlength: 7,
            maxlength: 10
          },
          email: {
            required: true,
            email: true,
            realEmail: true
          },
          phone: {
            required: true,
            phPhone: true
          },
          password: {
            required: true,
            minlength: 7,
            maxlength: 12
          },
          confirmPassword: {
            required: true,
            equalTo: "#password"
          }
        },
        messages: {
          username: {
            required: "Please enter a username",
            minlength: "Username must be at least 7 characters",
            maxlength: "Username must not exceed 10 characters"
          },
          email: {
            required: "Please enter your email",
            email: "Please enter a valid email address"
          },
          phone: {
            required: "Please enter your phone number"
          },
          password: {
            required: "Please enter a password",
            minlength: "Password must be at least 7 characters",
            maxlength: "Password must not exceed 12 characters"
          },
          confirmPassword: {
            required: "Please confirm your password",
            equalTo: "Passwords do not match"
          }
        },
        errorPlacement: function (error, element) {
          error.insertAfter(element.parent());
        },
        submitHandler: function (form) {
          var users = JSON.parse(localStorage.getItem("users")) || [];
          var username = $.trim($("input[name='username']").val()).toLowerCase();
          var email = $.trim($("input[name='email']").val()).toLowerCase();

          for (var i = 0; i < users.length; i++) {
            if (users[i].username === username || users[i].email === email) {
              $("#message").attr("class", "fail").text("Username or email is already registered").show();
              return;
            }
          }

          users.push({
            username: username,
            email: email,
            phone: $("input[name='phone']").val(),
            password: $("#password").val()
          });
          localStorage.setItem("users", JSON.stringify(users));

          $("#message").attr("class", "ok").text("Registration successful! Redirecting to login...").show();
          setTimeout(function () {
            window.location.href = "login.html";
          }, 2000);
        }
      });

    });
  </script>

</body>
</html>
